<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget d'Adressage Patient</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { width: 420px; min-height: 200px; margin: 0; padding: 0; }
        .header { padding: 0.75rem 1rem; background: #1e40af; color: #fff; }
        .header h1 { font-size: 1rem; margin: 0; }
        .card { padding: 1rem; }
        .card h2 { font-size: 0.95rem; margin: 0 0 0.75rem; }
        .form-group { margin-bottom: 0.75rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
        select { width: 100%; padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.9rem; }
        .actions { display: flex; gap: 8px; margin-top: 1rem; }
        .btn { padding: 9px 16px; border: none; border-radius: 7px; cursor: pointer; font-weight: 600; font-size: 0.9rem; flex: 1; }
        .btn-primary { background: #DC2626; color: #fff; }
        .btn-primary:hover { background: #B91C1C; }
        .patient-box { background: #f0fdf4; border: 1px solid #86efac; border-radius: 8px; padding: 10px; margin-bottom: 0.75rem; font-size: 0.85rem; }
        .patient-box strong { display: block; margin-bottom: 4px; color: #166534; }
        .help { font-size: 0.8rem; color: #6b7280; margin: 0; }
        #noPatientMsg { padding: 1rem; font-size: 0.85rem; color: #6b7280; text-align: center; }
    </style>
</head>
<body>
    <header class="header">
        <h1>📋 Adressage Patient — Ophtalmologie</h1>
    </header>

    <main>
        <!-- Données patient -->
        <div class="card" id="patientCard">
            <div id="autoExtractedSection" style="display:none;">
                <div class="patient-box">
                    <strong>👤 Patient détecté</strong>
                    <div id="autoExtractedPatientInfo"></div>
                </div>
                <button id="useAutoExtractedBtn" class="btn btn-primary">✓ Utiliser ces données</button>
            </div>
            <p id="noPatientMsg">Ouvrez la fiche d'un patient sur Doctolib pour détecter ses données.</p>
        </div>

        <!-- Formulaire d'adressage -->
        <div class="card" id="referralSection" style="display:none;">
            <div class="patient-box">
                <strong>👤 Patient sélectionné</strong>
                <div id="selectedPatientInfo"></div>
            </div>

            <div class="form-group">
                <label for="urgencyLevel">Degré d'urgence *</label>
                <select id="urgencyLevel" required>
                    <option value="">-- Sélectionner --</option>
                    <option value="very-urgent">🔴 Rouge — Dans la semaine</option>
                    <option value="urgent">🟠 Orange — 2 semaines</option>
                    <option value="normal">🟢 Vert — Dans le mois</option>
                </select>
            </div>

            <div class="form-group">
                <label for="referralReason">Motif d'adressage *</label>
                <select id="referralReason" required>
                    <option value="">-- Sélectionner --</option>
                    <option value="refractive">Chirurgie réfractive</option>
                    <option value="cataract">Chirurgie de la cataracte</option>
                    <option value="intravitreal-injection">IVT (Injection intravitréenne)</option>
                    <option value="glaucoma">Glaucome</option>
                    <option value="vitreoretinal">Chirurgie vitréorétinienne</option>
                    <option value="laser">Laser (YAG / Argon)</option>
                    <option value="other">Autre</option>
                </select>
            </div>

            <div class="actions">
                <button id="sendEmailBtn" class="btn btn-primary">📧 Envoyer par Email</button>
            </div>
        </div>
    </main>

    <!-- Modal paramètres (identité praticien) -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙️ Identification</h2>
                <button class="modal-close" id="closeSettingsBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="doctorName">Nom du praticien *</label>
                    <input type="text" id="doctorName" class="form-input" placeholder="Dr. Nom Prénom">
                </div>
                <div class="form-group">
                    <label for="doctorSpecialty">Spécialité</label>
                    <input type="text" id="doctorSpecialty" class="form-input" value="Ophtalmologue">
                </div>
                <div class="form-group">
                    <label for="doctorRPPS">N° RPPS</label>
                    <input type="text" id="doctorRPPS" class="form-input">
                </div>
                <div class="form-group">
                    <label for="practiceAddress">Adresse du cabinet</label>
                    <textarea id="practiceAddress" class="form-textarea" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="practicePhone">Téléphone</label>
                    <input type="tel" id="practicePhone" class="form-input">
                </div>
            </div>
            <div class="modal-footer">
                <button id="saveSettingsBtn" class="btn btn-primary">💾 Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- Modal prévisualisation (conservée en DOM pour compatibilité email.js) -->
    <div id="previewModal" class="modal" style="display:none;">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2>Prévisualisation</h2>
                <button class="modal-close" id="closePreviewBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div id="previewContent"></div>
            </div>
            <div class="modal-footer">
                <button id="closePreviewBtn2" class="btn btn-secondary">Fermer</button>
            </div>
        </div>
    </div>

    <!-- conservé en DOM caché pour compatibilité -->
    <input type="hidden" id="careType" value="other">
    <input type="hidden" id="careTypeOther" value="">
    <textarea id="letterContent" style="display:none;"></textarea>

    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="js/templates.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/csv-parser.js"></script>
    <script src="js/email.js"></script>
    <script src="js/popup.js"></script>
</body>
</html>
